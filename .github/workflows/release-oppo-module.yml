name: release module (OPPO source build)

# 用适配 OPPO 官方源码编译出的 nomount.ko，替换模块包里的通用 LKM，
# 重新打包成可直接刷入的 NoMount 模块。
#
# 与官方 release 的区别只有一处：lkm/ 里的 nomount.ko 是用 OPPO
# mt6989 官方内核源码树（含 vendor/oplus）编译的，因此
#   - struct file_operations / inode_operations 等字段偏移与设备内核一致
#   - __versions 段带本机内核的符号 CRC
#   - vermagic 与设备内核匹配
# 官方 DDK 容器编出的通用 KO 这三点都满足不了，加载后容易 panic。

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'OPPO 内核源码仓库'
        required: false
        type: string
        default: 'oppo-source/android_kernel_oppo_mt6989'
      kernel_branch:
        description: 'OPPO 内核源码分支'
        required: false
        type: string
        default: 'oppo/mt6989_b_16.0.0_find_x7'
      modules_repo:
        description: 'OPPO 内核模块仓库(提供 vendor/oplus)'
        required: false
        type: string
        default: 'oppo-source/android_kernel_modules_oppo_mt6989'
      modules_branch:
        description: 'OPPO 内核模块分支'
        required: false
        type: string
        default: 'oppo/mt6989_b_16.0.0_find_x7'
      nomount_ref:
        description: 'nomount 源码版本(留空用当前分支)'
        required: false
        type: string
        default: ''
      use_cached_symvers:
        description: '复用已缓存的 vmlinux.symvers(跳过约15分钟的 vmlinux 编译)'
        required: true
        type: boolean
        default: true
      device_kernelrelease:
        description: '设备上 uname -r 的完整输出(如 6.1.157-android14-11-o-ga8ed1c96e9fd)。ko 的 vermagic 必须与之完全一致'
        required: true
        type: string
        default: '6.1.157-android14-11-o-ga8ed1c96e9fd'
      device_headers_url:
        description: '运行内核精确头文件包(kheaders.tar.xz)的可下载地址。若提供, 用它替换开源树头文件以彻底匹配 struct 布局'
        required: false
        type: string
        default: ''
      patch_crc:
        description: '【危险】强行覆盖 module_layout CRC。仅用于诊断, 关闭 ABI 检查会导致装载后 panic'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:
  build-ko:
    name: Build OPPO-adapted nomount.ko
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      kernelrelease: ${{ steps.krel.outputs.kernelrelease }}

    steps:
      - name: Checkout nomount
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 切换到指定 nomount 版本
        if: inputs.nomount_ref != ''
        run: |
          git fetch --all --tags --quiet || true
          git checkout "${{ inputs.nomount_ref }}"

      - name: 缓存 Clang 工具链
        uses: actions/cache@v5
        with:
          path: |
            kernel_workspace/clang20
            kernel_workspace/build-tools
          key: oppo-toolchain-clang20-r547379-v1

      - name: 安装依赖 + 准备 Clang 工具链
        run: |
          set -euo pipefail
          sudo apt-mark hold firefox libc-bin >/dev/null 2>&1 || true
          sudo apt purge man-db >/dev/null 2>&1 || true
          sudo rm -rf /var/lib/man-db/auto-update || true
          sudo apt update
          sudo apt-get install -y --no-install-recommends \
            binutils python-is-python3 libssl-dev libelf-dev zip

          mkdir -p kernel_workspace
          cd kernel_workspace

          if [ -x clang20/bin/clang ] && [ -d build-tools/bin ]; then
            echo ">>> 工具链缓存命中"
            ./clang20/bin/clang --version | head -n1
            exit 0
          fi

          TCL_BASE="https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang20-r547379"

          fetch() {
            local name="$1" out="$2" tries=8 i=1
            local -a urls=(
              "$TCL_BASE/$name"
              "https://ghproxy.net/$TCL_BASE/$name"
              "https://gh-proxy.com/$TCL_BASE/$name"
            )
            while [ "$i" -le "$tries" ]; do
              local u="${urls[$(( (i-1) % ${#urls[@]} ))]}"
              echo "  下载尝试 $i/$tries: $u"
              if aria2c -s16 -x16 -k1M --max-tries=2 --retry-wait=3 \
                   --timeout=30 --connect-timeout=15 --lowest-speed-limit=1k \
                   --continue=true "$u" -o "$out"; then
                return 0
              fi
              echo "::warning::$name 下载失败 (第 $i/$tries 次)"
              i=$((i+1)); sleep $((i * 3))
            done
            echo "::error::无法下载 $name"
            return 1
          }

          mkdir -p clang20
          fetch clang-r547379.zip clang.zip
          unzip -q -o clang.zip -d clang20
          rm -f clang.zip

          fetch build-tools.zip build-tools.zip
          unzip -q -o build-tools.zip
          rm -f build-tools.zip

          ./clang20/bin/clang --version | head -n1

      - name: 缓存内核源码与 vendor
        uses: actions/cache@v5
        with:
          path: |
            kernel_workspace/common
            kernel_workspace/vendor
          key: oppo-kernel-${{ inputs.kernel_branch }}-${{ inputs.modules_branch }}-v1

      - name: 准备内核源码与 vendor
        run: |
          set -euo pipefail
          cd kernel_workspace

          fetch() {
            local name="$1" url="$2" out="$3" tries=8 i=1
            local -a urls=("$url" "https://ghproxy.net/$url" "https://gh-proxy.com/$url")
            while [ "$i" -le "$tries" ]; do
              local u="${urls[$(( (i-1) % ${#urls[@]} ))]}"
              echo "  下载尝试 $i/$tries: $u"
              if aria2c -s16 -x16 -k1M --max-tries=2 --retry-wait=3 \
                   --timeout=30 --connect-timeout=15 --lowest-speed-limit=1k \
                   --continue=true "$u" -o "$out"; then
                return 0
              fi
              echo "::warning::$name 下载失败 (第 $i/$tries 次)"
              i=$((i+1)); sleep $((i * 3))
            done
            echo "::error::无法下载 $name"
            return 1
          }

          if [ -d common/fs ] && [ -d vendor/oplus/kernel ]; then
            echo ">>> 内核源码与 vendor 缓存命中"
          else
            rm -rf common vendor

            echo ">>> 下载内核树"
            fetch kernel \
              "https://github.com/${{ inputs.kernel_repo }}/archive/refs/heads/${{ inputs.kernel_branch }}.zip" \
              common.zip
            unzip -q -o common.zip
            mv "$(find . -maxdepth 1 -type d -name 'android_kernel_*' | head -n1)" common
            rm -f common.zip

            echo ">>> 下载 OPPO 模块仓库"
            fetch modules \
              "https://github.com/${{ inputs.modules_repo }}/archive/refs/heads/${{ inputs.modules_branch }}.zip" \
              modules.zip
            unzip -q -o modules.zip
            mv "$(find . -maxdepth 1 -type d -name 'android_kernel_modules_*' | head -n1)" modules
            rm -f modules.zip

            # drivers/soc/oplus/* 指向 ../../../../vendor/oplus/kernel/...
            # 从 common/drivers/soc/oplus 上溯 4 级 = kernel_workspace/
            cp -r modules/vendor vendor
            rm -rf modules
          fi

          echo ">>> vendor: $(du -sh vendor 2>/dev/null | cut -f1)"

      - name: 缓存内核符号表
        id: symvers
        uses: actions/cache@v5
        with:
          path: kernel_workspace/common/out/vmlinux.symvers
          # v3: 改用设备完整 config 作基线, struct 布局与所有 CRC 都会变, 必须重算
          key: oppo-vmlinux-symvers-${{ inputs.kernel_branch }}-devcfg-v3

      - name: 清理 ABI 文件并对齐设备内核版本
        run: |
          set -euo pipefail
          cd kernel_workspace

          # 设备 uname -r 形如 6.1.157-android14-11-o-ga8ed1c96e9fd。
          # 官方开源树的 Makefile SUBLEVEL 可能与出货内核不同(本次就是
          # 树里写 134、设备跑 157，OPPO 发布代码没同步版本号)，而
          # vermagic 是整串字符串比对，所以 sublevel 和后缀都要对齐。
          DEVICE_KREL="${{ inputs.device_kernelrelease }}"
          KSUB="$(echo "$DEVICE_KREL" | cut -d'.' -f3 | cut -d'-' -f1)"
          KSUFFIX="$(echo "$DEVICE_KREL" | cut -d'-' -f2-)"
          echo ">>> 设备内核: $DEVICE_KREL (sublevel=$KSUB, suffix=$KSUFFIX)"

          # 对齐 Makefile SUBLEVEL (只影响版本串, 不参与 symvers/CRC)
          CUR_SUB="$(sed -n 's/^SUBLEVEL = //p' common/Makefile | tr -d ' ')"
          if [ "$CUR_SUB" != "$KSUB" ]; then
            sed -i "s/^SUBLEVEL = .*/SUBLEVEL = $KSUB/" common/Makefile
            echo ">>> Makefile SUBLEVEL: $CUR_SUB -> $KSUB"
          fi

          rm -f common/android/abi_gki_protected_exports_* || true
          for f in common/scripts/setlocalversion; do
            sed -i 's/ -dirty//g' "$f"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$f"
            # setlocalversion 在非干净 tag 状态且 LOCALVERSION 未设置时会追加 "+"，
            # 而 vermagic 带 "+" 会让设备 insmod 报 version magic mismatch 直接拒绝。
            sed -i 's|res="$res${scm:++}"|res="$res"|' "$f"
            # 把 setlocalversion 输出整体替换为设备内核的后缀。
            # 另注: 内核树经 zip 下载没有 .git, 但 setlocalversion 的 git rev-parse
            # 会向上层目录找到 CI checkout 的 .git, 把无关的 commit hash 泄进版本号;
            # 固定后缀替换同时规避了这个问题。
            sed -i "\$s|echo \"\\\$res\"|echo \"-$KSUFFIX\"|" "$f"
          done
          echo ">>> setlocalversion 输出已固定为: -$KSUFFIX"
          tail -n 3 common/scripts/setlocalversion
      - name: 对齐 struct module 布局 (MITIGATION_ITS)
        run: |
          set -euo pipefail
          cd kernel_workspace/common

          # 剔除注释后逐行比对设备 kheaders 与本树的 include/linux/module.h，
          # struct module 的唯一实质差异是设备多出这一段:
          #
          #   #ifdef CONFIG_MITIGATION_ITS
          #           int its_num_pages;
          #           void **its_page_array;
          #   #endif
          #
          # 设备是 6.1.157, 本树是 6.1.134, 该 mitigation 由较新的 stable 引入,
          # 所以树里既无这段字段也无对应 Kconfig。
          #
          # 这段字段决定 module_layout CRC:
          #   设备 0xea759d7f  vs  本树 0xa26bedb1
          # check_modstruct_version() 不匹配时返回 -ENOEXEC 且不打印任何日志;
          # 强行改 CRC 会让 mod_sysfs_setup 越界 panic。所以必须让布局真正一致。
          python3 "$GITHUB_WORKSPACE/scripts/patch_module_layout.py" .

          echo "=== 确认字段已插入 ==="
          grep -n -B1 -A2 'its_num_pages' include/linux/module.h || {
            echo "::error::字段注入失败"; exit 1; }



      - name: 挂载 nomount 源码
        run: |
          set -euo pipefail
          cd kernel_workspace/common

          rm -rf fs/nomount && mkdir -p fs/nomount
          cp -f "$GITHUB_WORKSPACE"/kernel/src/*.c \
                "$GITHUB_WORKSPACE"/kernel/src/*.h \
                "$GITHUB_WORKSPACE"/kernel/src/Makefile \
                "$GITHUB_WORKSPACE"/kernel/src/Kconfig fs/nomount/

          if ! grep -q 'fs/nomount/Kconfig' fs/Kconfig; then
            awk '
              /^endmenu/ { last = NR }
              { lines[NR] = $0 }
              END {
                for (i = 1; i <= NR; i++) {
                  if (i == last) print "source \"fs/nomount/Kconfig\""
                  print lines[i]
                }
              }
            ' fs/Kconfig > fs/Kconfig.tmp && mv fs/Kconfig.tmp fs/Kconfig
          fi

          if ! grep -q 'nomount' fs/Makefile; then
            printf '\nobj-$(CONFIG_NOMOUNT) += nomount/\n' >> fs/Makefile
          fi
          ls -la fs/nomount

      - name: 生成 .config 并 modules_prepare
        run: |
          set -euo pipefail
          WORKDIR="$(pwd)"
          export PATH="$WORKDIR/kernel_workspace/clang20/bin:$PATH"
          export PATH="$WORKDIR/kernel_workspace/build-tools/bin:$PATH"

          cd kernel_workspace/common

          FLAGS="LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
            CC=clang LD=ld.lld HOSTCC=clang HOSTLD=ld.lld O=out
            KCFLAGS+=-O2 KCFLAGS+=-Wno-error HOSTCFLAGS+=-Wno-error WERROR=0"

          # 用设备内核的完整 config 作为基线, 但必须"先树后设备"两步走。
          #
          # 背景: 设备 config 有 3094 项，而 gki_defconfig 只有 666 项。
          # 缺掉的那些里有 CONFIG_SYSFS / CONFIG_FTRACE / CONFIG_STACKTRACE_BUILD_ID
          # 这类会改变 struct module 字段组成的开关。布局不同 ->
          # mod_sysfs_setup() 按自己的偏移访问越界 -> 刷入即 panic：
          #   pc: mod_sysfs_setup+0x218/0x2ec   x1 处可见 "nomount"
          #
          # 观测到的两种失败:
          #   1) make xxx_defconfig: 把 2400 个 vendor 专属符号当未知项,
          #      连锁重置 CONFIG_MODULES/MODVERSIONS/MODULE_UNLOAD,
          #      vmlinux 直接拒绝编译("modules disabled")。
          #   2) 纯 syncconfig: 树里有设备未记录的新符号, Kconfig 以 "(NEW)"
          #      提问, 非交互下取默认值, 同样重置关键项。
          #
          # 可行解: 先让树基于 gki_defconfig 生成自洽 .config, 再把设备
          # 显式声明的每一项强制覆盖上去。
          make -j"$(nproc)" $FLAGS gki_defconfig
          cp -f out/.config out/.config.tree

          # 用设备 config 覆盖: 设备里出现的每一项都强制写入(含 =n),
          # 保证 struct module 等结构的条件开关与设备一致。
          # 逻辑放在 scripts/overlay_config.py, 避免把 Python 内联进 YAML
          # (缩进一旦错位整个 workflow 会解析失败)。
          python3 "$GITHUB_WORKSPACE/scripts/overlay_config.py" \
            out/.config.tree "$GITHUB_WORKSPACE/device_full.config" out/.config

          # 设备 config 里 CONFIG_MODULE_SIG_KEY 指向打包时才知道的路径，
          # 且 CONFIG_MODULE_SIG_ALL 未开启（模块不签名），对齐为不指定密钥。
          sed -i -E 's|^CONFIG_MODULE_SIG_KEY=.*|# CONFIG_MODULE_SIG_KEY is not set|' out/.config

          # BTF 相关：不参与 genksyms CRC，关闭不影响 ABI。
          # NOMOUNT 必须在此写入；fs/nomount/Kconfig 已在前一步挂载。
          ./scripts/config --file out/.config \
            -d DEBUG_INFO_BTF -d DEBUG_INFO_BTF_MODULES -d DEBUG_INFO -d PAHOLE \
            -m NOMOUNT

          echo "=== 配置与设备一致性核对 ==="
          MISS=0
          for k in CONFIG_MODULES CONFIG_SYSFS CONFIG_FTRACE CONFIG_MODULE_UNLOAD \
                   CONFIG_KALLSYMS_ALL CONFIG_CFI_CLANG CONFIG_TRACEPOINTS \
                   CONFIG_JUMP_LABEL CONFIG_MODVERSIONS CONFIG_ARM64; do
            if grep -q "^${k}=y" out/.config; then
              echo "  OK    $k=y"
            else
              echo "  MISS  $k"
              case "$k" in
                CONFIG_MODULES|CONFIG_MODVERSIONS|CONFIG_MODULE_UNLOAD|CONFIG_ARM64) MISS=1 ;;
              esac
            fi
          done
          [ "$MISS" -eq 0 ] || {
            echo "::error::关键配置缺失, 该配置无法产出可用模块"
            echo "--- .config 中相关行 ---"
            grep -E '^#? ?CONFIG_(MODULES|MODVERSIONS|MODULE_UNLOAD|ARM64)\b' out/.config || true
            exit 1
          }

          make -j"$(nproc)" $FLAGS syncconfig

          # syncconfig 后再次确认(它可能仍会改动个别项)
          echo "=== syncconfig 后复核 ==="
          for k in CONFIG_MODULES CONFIG_MODVERSIONS CONFIG_MODULE_UNLOAD; do
            grep -q "^${k}=y" out/.config && echo "  OK    $k=y" || {
              echo "::error::syncconfig 后 $k 被重置"; exit 1; }
          done

          make -j"$(nproc)" $FLAGS modules_prepare

          echo "=== 确认 auto.conf 里 NOMOUNT 已生效 ==="
          grep '^CONFIG_NOMOUNT' out/include/config/auto.conf || {
            echo "::error::auto.conf 里没有 CONFIG_NOMOUNT"
            exit 1
          }

          # 硬闸门: 用设备完整 config 编译时, genksyms 应算出与设备相同的
          # module_layout CRC。等 ko 编出来后在"校验 ko"步骤做最终断言；
          # 这里只记录当前配置下 vmlinux 侧的值作为预期基线。
          echo "=== 当前配置下 module_layout CRC 基线 ==="
          if [ -f out/vmlinux.symvers ]; then
            grep -P '\tmodule_layout\t' out/vmlinux.symvers || echo "  (vmlinux.symvers 中暂无 module_layout)"
          fi

          KREL="$(cat out/include/config/kernel.release 2>/dev/null || make -s O=out ARCH=arm64 LLVM=1 kernelrelease)"
          echo "KERNELRELEASE=$KREL" >> "$GITHUB_ENV"
          echo "内核版本: $KREL"

      - name: 编译 nomount.ko
        run: |
          set -euo pipefail
          WORKDIR="$(pwd)"
          export PATH="$WORKDIR/kernel_workspace/clang20/bin:$PATH"
          export PATH="$WORKDIR/kernel_workspace/build-tools/bin:$PATH"

          cd kernel_workspace/common

          FLAGS="LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
            CC=clang LD=ld.lld HOSTCC=clang HOSTLD=ld.lld O=out
            KCFLAGS+=-O2 KCFLAGS+=-Wno-error HOSTCFLAGS+=-Wno-error WERROR=0"

          # 外部模块构建时 modpost 只读 extmod 目录下的 Module.symvers，
          # 不会去读 out/vmlinux.symvers。没有这张 CRC 表，ko 的 __versions
          # 段就是空的，设备上加载会失败或解析到错位函数指针而 panic。
          if [ -s out/vmlinux.symvers ]; then
            echo ">>> 符号表已存在: $(wc -l < out/vmlinux.symvers) 条"
          else
            echo ">>> 编译 vmlinux 以生成符号表 (约 15-20 分钟)..."
            make -j"$(nproc)" $FLAGS vmlinux || true
          fi

          [ -s out/vmlinux.symvers ] || { echo "::error::符号表缺失"; exit 1; }
          echo ">>> 符号表: $(wc -l < out/vmlinux.symvers) 条"

          cp -f out/vmlinux.symvers fs/nomount/Module.symvers
          cp -f out/vmlinux.symvers Module.symvers

          export KBUILD_EXTRA_SYMBOLS="$PWD/out/vmlinux.symvers"
          # 命令行变量双保险: 即使 auto.conf 异常, obj-m 也会被填上
          make -j"$(nproc)" $FLAGS CONFIG_NOMOUNT=m M="$PWD/fs/nomount" modules

          [ -f fs/nomount/nomount.ko ] || { echo "::error::未生成 nomount.ko"; exit 1; }
          ls -lh fs/nomount/nomount.ko

      - name: 用设备真实 CRC 修正 module_layout
        # 默认关闭。历史教训: 强行把 module_layout 的 CRC 改成设备值只是
        # 关掉了内核的 ABI 检查, ko 里的 __this_module 仍是按开源树的
        # struct module 布局生成的。内核对它按自己的偏移读写 -> 内存损坏 -> panic。
        # 正解是用与设备一致的头文件编译(见 device_headers 步骤), 而不是伪造 CRC。
        if: inputs.patch_crc
        run: |
          set -euo pipefail
          cd kernel_workspace/common
          KO=fs/nomount/nomount.ko

          # 开源树是 6.1.134，出货内核是 6.1.157。中间的 stable 回移改过
          # struct module，于是 genksyms 算出的 module_layout CRC 与设备不同。
          # 6.1 的 check_modstruct_version()（kernel/module/main.c）在 CRC
          # 不匹配时直接 return -ENOEXEC，且不打印任何日志 —— 用户态只能看到
          # "Exec format error"，无法从 dmesg 定位。这正是本项目的核心障碍。
          #
          # 设备上 /vendor{,_dlkm}/lib/modules/*.ko 每个模块都带 __versions 段，
          # 其中记录着它们导入符号在"运行内核"上的真实 CRC。逐符号覆盖之。
          python3 "$GITHUB_WORKSPACE/scripts/patch_crc.py" \
            "$KO" "$GITHUB_WORKSPACE/device_symvers.txt" "$KO.patched"
          mv -f "$KO.patched" "$KO"
          chmod 644 "$KO"
          ls -lh "$KO"

      - name: 校验 ko
        id: verify
        run: |
          set -euo pipefail
          WORKDIR="$(pwd)"
          export PATH="$WORKDIR/kernel_workspace/clang20/bin:$PATH"

          cd kernel_workspace/common
          KO=fs/nomount/nomount.ko

          VERMAGIC=$(modinfo -F vermagic "$KO" 2>/dev/null || strings "$KO" | grep -m1 'vermagic=' | sed 's/vermagic=//')
          echo "vermagic: $VERMAGIC"

          case "$VERMAGIC" in
            *"+"*)
              echo "::error::vermagic 含 '+', 设备 insmod 会拒绝加载"
              exit 1
              ;;
          esac
          echo "  OK: vermagic 无 '+'"

          VERS=$(llvm-objdump -h "$KO" 2>/dev/null | grep '__versions' | head -n1 || true)
          [ -n "$VERS" ] || { echo "::error::ko 缺少 __versions 段"; exit 1; }
          VERS_SIZE=$((16#$(echo "$VERS" | awk '{print $3}')))
          echo "  __versions 段: $VERS_SIZE 字节 (~$((VERS_SIZE / 64)) 条 CRC)"
          [ "$VERS_SIZE" -gt 0 ] || { echo "::error::__versions 段为空"; exit 1; }

          MISSING=0
          for sym in d_lookup d_splice_alias d_add iget5_locked register_key_type \
                     generic_file_mmap generic_file_read_iter vfs_getattr \
                     notify_change kill_anon_super deactivate_locked_super; do
            grep -qE "\b${sym}\b" out/vmlinux.symvers || { echo "  MISSING $sym"; MISSING=$((MISSING+1)); }
          done
          echo "  缺失关键符号: $MISSING"
          [ "$MISSING" -eq 0 ] || { echo "::error::关键 VFS 符号缺失"; exit 1; }

          echo "=== 校验 module_layout CRC 与设备一致 ==="
          # 这是最重要的断言：module_layout 由 struct module 布局决定，
          # 布局又由 .config 的条件编译开关决定。它相等 => 我们的
          # __this_module 与内核的 struct module 逐字节同构，加载安全。
          # 若不等 => 配置仍有差异，绝不允许发布(强行改 CRC 会导致
          # mod_sysfs_setup 越界, 表现为刷入瞬间 panic)。
          DEV_ML=$(awk -F'\t' '$2=="module_layout"{print $1; exit}' "$GITHUB_WORKSPACE/device_symvers.txt")
          KO_ML=$(python3 "$GITHUB_WORKSPACE/scripts/get_crc.py" "$KO" module_layout)
          echo "  设备 module_layout: ${DEV_ML:-<none>}"
          echo "  ko   module_layout: $KO_ML"
          [ -n "$DEV_ML" ] || { echo "::error::device_symvers.txt 里没有 module_layout"; exit 1; }
          if [ "$DEV_ML" != "$KO_ML" ]; then
            echo "::error::module_layout 不一致 —— struct module 布局仍与设备不同"
            echo "  说明 .config 还没完全复刻设备。强行改 CRC 会导致加载后 panic，"
            echo "  因此这里必须失败。请检查 device_full.config 是否被完整应用。"
            echo "--- 影响 struct module 的开关 ---"
            grep -E '^CONFIG_(SYSFS|FTRACE|MODULE_UNLOAD|KALLSYMS_ALL|CFI_CLANG|TRACEPOINTS|JUMP_LABEL|STACKTRACE_BUILD_ID|LIVEPATCH)=' out/.config || true
            exit 1
          fi
          echo "  OK: module_layout 与设备一致 => struct module 布局匹配"

          echo "KO_VERMAGIC=$VERMAGIC" >> "$GITHUB_ENV"

      - name: 记录内核版本
        id: krel
        run: |
          echo "kernelrelease=$KERNELRELEASE" >> "$GITHUB_OUTPUT"

      - name: 上传 ko
        uses: actions/upload-artifact@v7
        with:
          name: nomount-ko-oppo
          path: kernel_workspace/common/fs/nomount/nomount.ko

  release:
    name: Pack and release module
    needs: build-ko
    runs-on: ubuntu-latest

    steps:
      - name: Checkout nomount
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 切换 nomount 版本
        if: inputs.nomount_ref != ''
        run: |
          git fetch --all --tags --quiet || true
          git checkout "${{ inputs.nomount_ref }}"

      - name: 安装打包依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zip jq

      - name: 下载适配的 ko
        uses: actions/download-artifact@v7
        with:
          name: nomount-ko-oppo
          path: ./ko

      - name: 准备模块目录
        run: |
          set -euo pipefail

          # artifact 现在是打包上传, 先解开找到 nomount.ko
          # 注意: find 可能返回相对路径, 后面会 cd, 必须先转成绝对路径
          KO_SRC="$(find "$(pwd)/ko" -name 'nomount.ko' | head -n1)"
          [ -n "$KO_SRC" ] || { echo "::error::artifact 里没有 nomount.ko"; ls -R ./ko; exit 1; }
          echo "ko: $KO_SRC ($(stat -c%s "$KO_SRC") bytes)"

          # 模块基底使用上游官方 release zip: 仓库里的 module/ 目录不含 bin/，
          # 而 bin/nm-* 和 bin/lkmloader-* 是上游 CI 用 zig 交叉编译后注入的。
          # 缺了它们，customize.sh 会在架构检查处 abort —— 报错文案误写成
          # "Unsupported architecture"，实际是二进制缺失。
          echo ">>> 下载上游官方 release 作为模块基底..."
          mkdir -p upstream_rel
          for i in 1 2 3 4 5; do
            if gh release download -R maxsteeel/nomount \
                 --pattern 'NoMount-*.zip' --dir upstream_rel --clobber; then
              break
            fi
            echo "::warning::上游 release 下载失败 (第 $i/5 次)"
            sleep $((i * 4))
          done
          UPSTREAM_ZIP="$(find upstream_rel -name 'NoMount-*.zip' | head -n1)"
          [ -n "$UPSTREAM_ZIP" ] || { echo "::error::拿不到上游 release zip"; exit 1; }
          echo "上游包: $UPSTREAM_ZIP"

          mkdir -p build
          rm -rf build/nomount
          mkdir -p build/nomount
          unzip -q "$UPSTREAM_ZIP" -d build/nomount

          echo "=== 上游包内容 (确认 bin/ 存在) ==="
          ls build/nomount
          ls build/nomount/bin/ 2>/dev/null || echo "  警告: 上游包也没有 bin/"
          ls build/nomount/lkm/ 2>/dev/null

          cd build/nomount

          # 移除上游全部通用 LKM: 它们的 vermagic/CRC 是 GKI DDK 的，
          # 留着任何一个都可能被 customize.sh 的 glob 兜底逻辑选中加载，
          # 在厂商内核上必然 panic。
          rm -f lkm/nomount-*.ko

          # Ko 命名必须符合 customize.sh 的查找规则:
          #   EXACT = lkm/nomount-${AKVER}-${KVER}${ARCH_SFX}.ko
          #   KVER  = uname -r 前两段, 这里是 6.1
          #   AKVER = uname -r 里的 androidN, OPPO 内核可能没有这一段
          # 两种都放一份, 保证任何分支都能命中.
          KREL="${{ needs.build-ko.outputs.kernelrelease }}"
          KVER="$(echo "$KREL" | cut -d'.' -f1,2)"
          echo "KERNELRELEASE=$KREL  KVER=$KVER"

          cp "$KO_SRC" "lkm/nomount-android14-${KVER}.ko"
          cp "$KO_SRC" "lkm/nomount-${KVER}.ko"

          ls -lh lkm/

      - name: 修改 module.prop 标识
        run: |
          set -euo pipefail
          cd build/nomount

          KREL="${{ needs.build-ko.outputs.kernelrelease }}"
          BASE_VER="$(sed -n 's/^version=//p' module.prop | tr -d '\r ')"

          # 版本号追加构建号, 保持与上游一致的展示形式
          sed -i "s|^version=.*|version=${BASE_VER} (${KREL})|" module.prop
          # 不跟随上游 updateJson, 否则管理器会把这份适配版覆盖回通用 KO
          sed -i "/^updateJson=/d" module.prop

          echo "=== module.prop ==="
          cat module.prop

      - name: 打包模块 zip
        id: pack
        run: |
          set -euo pipefail
          SHORT="$(git rev-parse --short HEAD)"
          BASE_VER="$(sed -n 's/^version=//p' build/nomount/module.prop | tr -d '\r ' | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n1)"
          [ -n "$BASE_VER" ] || BASE_VER="v2.2.0"

          TAG="NoMount-${BASE_VER}-${SHORT}"
          ZIP="${TAG}.zip"

          cd build/nomount
          zip -qr9 "../../${ZIP}" .
          cd ../..

          ls -lh "$ZIP"
          echo "--- zip 内容 ---"
          unzip -l "$ZIP"

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "basever=$BASE_VER" >> "$GITHUB_OUTPUT"

      - name: 生成发布说明
        run: |
          set -euo pipefail
          cat > notes.md <<'EOF'
          ### NoMount ${{ steps.pack.outputs.basever }}

          #### 本版说明

          本包的 `lkm/nomount.ko` 使用 **OPPO 官方开源源码树**编译，
          而非上游 release 里那份由 GKI DDK 容器生成的通用模块。

          NoMount 工作在 VFS 层，运行时会直接替换目标目录的
          `inode->i_op` / `i_fop` / `sb->s_op`，并通过 `container_of`
          从成员地址反推结构体基址。因此只要结构体字段偏移与本机内核
          有任何差异，写进去的就是错位的函数指针，内核一旦调用即 panic。
          这正是通用 KO 在厂商魔改内核上容易崩溃的原因。

          | 项目 | 上游通用 KO | 本包 |
          |---|---|---|
          | 头文件来源 | GKI 通用 `include/linux/fs.h` | 厂商官方树同一份 |
          | 符号 CRC | GKI 的 `Module.symvers` | 本机 `vmlinux.symvers` |
          | vermagic | GKI KMI 格式 | 与本机内核一致 |

          #### 适配信息

          | 项 | 值 |
          |---|---|
          | 内核源码 | `${{ inputs.kernel_repo }}` |
          | 内核分支 | `${{ inputs.kernel_branch }}` |
          | 模块源码 | `${{ inputs.modules_repo }}` |
          | 模块分支 | `${{ inputs.modules_branch }}` |
          | 内核版本 | `${{ needs.build-ko.outputs.kernelrelease }}`（对齐设备 `uname -r`） |
          | 设备内核 | `${{ inputs.device_kernelrelease }}` |
          | 配置基线 | 设备运行内核的完整 `.config`（3094 项，非 gki_defconfig 的 666 项） |
          | 工具链 | Clang 20 (Android r547379) |
          | nomount | `${{ github.sha }}` |

          #### vermagic 对齐说明

          ko 的 vermagic 必须与设备上**正在运行**的内核完全一致，否则
          `insmod` 直接报 `Exec format error` 拒绝加载。

          本包构建时已按设备 `uname -r`（`${{ inputs.device_kernelrelease }}`）
          对齐了 Makefile SUBLEVEL 与版本后缀。注意：开源树的 SUBLEVEL 可能
          与出货内核不同步（本次树内为 134、设备为 157），已自动修正。
          若设备 OTA 后内核版本变化，请填新的 `device_kernelrelease` 重新构建。

          #### 质量校验（构建时强制）

          - `vermagic` 不含 `+`，否则设备 `insmod` 会报 version magic mismatch
          - `__versions` 段非空，确符号 CRC 已写入
          - 11 个关键 VFS 符号在符号表中全部可解析

          任一项不满足，构建会直接失败，不会产出发布包。

          #### 安装

          用 KernelSU / APatch 管理器刷入本 zip 后重启。
          该模块是 metamodule，会接管其他模块的挂载过程。

          #### 注意

          - 刷入前请备份 `boot` 等启动分区
          - 模块自带 bootloop 保护：KO 加载失败会回滚到上一个可用版本
          - 系统 OTA 更新内核后需重新编译本模块
          EOF
          cat notes.md

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.pack.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${{ steps.pack.outputs.tag }}" \
            --notes-file notes.md \
            "${{ steps.pack.outputs.zip }}"

      - name: 上传 zip 工件
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pack.outputs.tag }}
          path: ${{ steps.pack.outputs.zip }}
